name: unieats

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - unieats

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://backend:4000
    expose:
      - "3000"
    networks:
      - unieats

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/unieats
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOCAL_EMAIL_VERIFY_TOKEN: ${LOCAL_EMAIL_VERIFY_TOKEN:-local-email-verify-token}
      LOCAL_PASSWORD_RESET_TOKEN: ${LOCAL_PASSWORD_RESET_TOKEN:-local-password-reset-token}
      LOCAL_PASSWORD_RESET_PASSWORD: ${LOCAL_PASSWORD_RESET_PASSWORD:-UnieatsReset123!}
    expose:
      - "4000"
    depends_on:
      - mongo
    networks:
      - unieats

  menu-sync:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/unieats
      KAIST_MENU_SYNC_INTERVAL_SECONDS: ${KAIST_MENU_SYNC_INTERVAL_SECONDS:-86400}
      KAIST_MENU_SYNC_RETRY_SECONDS: ${KAIST_MENU_SYNC_RETRY_SECONDS:-300}
      KAIST_MENU_SYNC_DAYS: ${KAIST_MENU_SYNC_DAYS:-7}
      KAIST_MENU_SYNC_START_DATE: ${KAIST_MENU_SYNC_START_DATE:-}
    command:
      - sh
      - -c
      - |
        set -u
        retry_seconds="$${KAIST_MENU_SYNC_RETRY_SECONDS:-300}"
        interval_seconds="$${KAIST_MENU_SYNC_INTERVAL_SECONDS:-86400}"
        sync_days="$${KAIST_MENU_SYNC_DAYS:-7}"

        echo "[menu-sync] bootstrapping KAIST seed data"
        until npm run seed:kaist; do
          echo "[menu-sync] seed failed; retrying in $${retry_seconds}s"
          sleep "$${retry_seconds}"
        done

        while true; do
          sync_args="--days=$${sync_days}"
          if [ -n "$${KAIST_MENU_SYNC_START_DATE:-}" ]; then
            sync_args="--start=$${KAIST_MENU_SYNC_START_DATE} $${sync_args}"
          fi

          echo "[menu-sync] running KAIST menu sync"
          if npm run sync:kaist-menu -- $${sync_args}; then
            echo "[menu-sync] sync complete; sleeping $${interval_seconds}s"
            sleep "$${interval_seconds}"
          else
            echo "[menu-sync] sync failed; retrying in $${retry_seconds}s"
            sleep "$${retry_seconds}"
          fi
        done
    depends_on:
      - mongo
    networks:
      - unieats

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-unieats}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - unieats

volumes:
  mongo-data:

networks:
  unieats:
