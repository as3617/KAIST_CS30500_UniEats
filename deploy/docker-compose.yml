name: unieats

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - unieats

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://backend:4000
    expose:
      - "3000"
    networks:
      - unieats

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/unieats
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    expose:
      - "4000"
    depends_on:
      - mongo
    networks:
      - unieats

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-unieats}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - unieats

volumes:
  mongo-data:

networks:
  unieats:
