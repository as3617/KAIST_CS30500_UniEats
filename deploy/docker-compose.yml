name: unieats

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-unieats.ssrf.kr}
      TLS_CERT_NAME: ${TLS_CERT_NAME:-local-selfsigned}
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - unieats

  cert-init:
    image: certbot/certbot:latest
    entrypoint:
      - sh
    restart: "no"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-unieats.ssrf.kr}
      TLS_CERT_NAME: ${TLS_CERT_NAME:-local-selfsigned}
    volumes:
      - letsencrypt:/etc/letsencrypt
    command:
      - -c
      - |
        set -eu
        cert_name="$${TLS_CERT_NAME:-local-selfsigned}"
        domain="$${TLS_DOMAIN:-unieats.ssrf.kr}"
        live_dir="/etc/letsencrypt/live/$${cert_name}"

        mkdir -p "$${live_dir}"
        if [ ! -f "$${live_dir}/fullchain.pem" ] || [ ! -f "$${live_dir}/privkey.pem" ]; then
          echo "[cert-init] creating local self-signed certificate for $${domain} at $${live_dir}"
          openssl req -x509 -nodes -newkey rsa:2048 -days 14 \
            -subj "/CN=$${domain}" \
            -addext "subjectAltName=DNS:$${domain},DNS:localhost,IP:127.0.0.1" \
            -keyout "$${live_dir}/privkey.pem" \
            -out "$${live_dir}/fullchain.pem"
        else
          echo "[cert-init] certificate already exists at $${live_dir}"
        fi
    networks:
      - unieats

  certbot:
    image: certbot/certbot:latest
    profiles:
      - tls
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - unieats

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://backend:4000
      KAKAO_MAP_APP_KEY: ${KAKAO_MAP_APP_KEY:-}
    expose:
      - "3000"
    networks:
      - unieats

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/unieats
      CORS_ORIGIN: ${CORS_ORIGIN:-https://unieats.ssrf.kr}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://unieats.ssrf.kr}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOCAL_EMAIL_VERIFY_TOKEN: ${LOCAL_EMAIL_VERIFY_TOKEN:-local-email-verify-token}
      LOCAL_PASSWORD_RESET_TOKEN: ${LOCAL_PASSWORD_RESET_TOKEN:-local-password-reset-token}
      LOCAL_PASSWORD_RESET_PASSWORD: ${LOCAL_PASSWORD_RESET_PASSWORD:-UnieatsReset123!}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:5000/process}
      OCR_WEBHOOK_URL: ${OCR_WEBHOOK_URL:-http://backend:4000/api/receipts/webhook}
      OCR_WEBHOOK_SECRET: ${OCR_WEBHOOK_SECRET:-local-ocr-webhook-secret}
    expose:
      - "4000"
    depends_on:
      - mongo
      - ocr
    networks:
      - unieats

  menu-sync:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/unieats
      KAIST_MENU_SYNC_INTERVAL_SECONDS: ${KAIST_MENU_SYNC_INTERVAL_SECONDS:-86400}
      KAIST_MENU_SYNC_RETRY_SECONDS: ${KAIST_MENU_SYNC_RETRY_SECONDS:-300}
      KAIST_MENU_SYNC_DAYS: ${KAIST_MENU_SYNC_DAYS:-7}
      KAIST_MENU_SYNC_START_DATE: ${KAIST_MENU_SYNC_START_DATE:-}
    command:
      - sh
      - -c
      - |
        set -u
        retry_seconds="$${KAIST_MENU_SYNC_RETRY_SECONDS:-300}"
        interval_seconds="$${KAIST_MENU_SYNC_INTERVAL_SECONDS:-86400}"
        sync_days="$${KAIST_MENU_SYNC_DAYS:-7}"

        echo "[menu-sync] bootstrapping KAIST seed data"
        until npm run seed:kaist; do
          echo "[menu-sync] seed failed; retrying in $${retry_seconds}s"
          sleep "$${retry_seconds}"
        done

        while true; do
          sync_args="--days=$${sync_days}"
          if [ -n "$${KAIST_MENU_SYNC_START_DATE:-}" ]; then
            sync_args="--start=$${KAIST_MENU_SYNC_START_DATE} $${sync_args}"
          fi

          echo "[menu-sync] running KAIST menu sync"
          if npm run sync:kaist-menu -- $${sync_args}; then
            echo "[menu-sync] sync complete; sleeping $${interval_seconds}s"
            sleep "$${interval_seconds}"
          else
            echo "[menu-sync] sync failed; retrying in $${retry_seconds}s"
            sleep "$${retry_seconds}"
          fi
        done
    depends_on:
      - mongo
    networks:
      - unieats

  ocr:
    build:
      context: ..
      dockerfile: deploy/ocr/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
    expose:
      - "5000"
    networks:
      - unieats

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-unieats}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - unieats

volumes:
  mongo-data:
  certbot-webroot:
  letsencrypt:

networks:
  unieats:
